plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
}

base {
    archivesName = "levelledmobs-apotheosis"
    version = project.findProperty('mod_version') ?: '1.0.0'
    group = 'lampas.levelledmobs'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
}

def fabricApiVersion = String.valueOf(
    project.findProperty('fabric_api_version') ?: '0.155.2+26.2'
)
def architecturyVersion = String.valueOf(
    project.findProperty('architectury_version') ?: '21.0.7'
)
def apotheosisVersion = String.valueOf(
    project.findProperty('apotheosis_version') ?: '26.2-10.0.0'
)
def apotheosisModVersion = apotheosisVersion.contains('-')
    ? apotheosisVersion.substring(apotheosisVersion.indexOf('-') + 1)
    : apotheosisVersion
def apotheosisFabricJar = rootProject.file(
    project.findProperty('apotheosis_fabric_jar') ?: "../Apotheosis/fabric/build/libs/Apotheosis-${apotheosisVersion}.jar"
)
def expectedApotheosisFabricSha256 = String.valueOf(
    project.findProperty('apotheosis_fabric_sha256') ?: ''
).toUpperCase(Locale.ROOT)
def placeboVersion = String.valueOf(
    project.findProperty('placebo_version') ?: '26.2-11.0.0'
)
def apothicAttributesVersion = String.valueOf(
    project.findProperty('apothic_attributes_version') ?: '26.2-4.0.0'
)
def placeboModVersion = placeboVersion.contains('-')
    ? placeboVersion.substring(placeboVersion.indexOf('-') + 1)
    : placeboVersion
def apothicAttributesModVersion = apothicAttributesVersion.contains('-')
    ? apothicAttributesVersion.substring(apothicAttributesVersion.indexOf('-') + 1)
    : apothicAttributesVersion
def placeboFabricJar = rootProject.file(
    project.findProperty('placebo_fabric_jar') ?: "../Placebo/fabric/build/libs/Placebo-${placeboVersion}.jar"
)
def apothicAttributesFabricJar = rootProject.file(
    project.findProperty('apothic_attributes_fabric_jar') ?:
        "../Apothic-Attributes/fabric/build/libs/ApothicAttributes-${apothicAttributesVersion}.jar"
)

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'levelledmobs-apotheosis-gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    localRuntime "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    // The addon compiles against the LevelledMobs API but never embeds it.
    compileOnly project(':levelledmobs-fabric')
    localRuntime project(':levelledmobs-fabric')

    // The sibling repository does not publish a loader-specific Maven coordinate in this checkout.
    // Consume the exact Fabric output instead; it remains external and is never included in the
    // addon JAR.
    compileOnly files(apotheosisFabricJar)
    localRuntime files(apotheosisFabricJar)

    // Runtime-only hard dependencies declared by Apotheosis' Fabric metadata. Local sibling
    // outputs keep the GameTest on the same ported stack as the verified Apotheosis artifact.
    localRuntime "dev.architectury:architectury-fabric:${architecturyVersion}"
    localRuntime files(placeboFabricJar, apothicAttributesFabricJar)

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    testImplementation project(':levelledmobs-fabric')
    testImplementation files(apotheosisFabricJar)

    gametestCompileOnly files(placeboFabricJar, apothicAttributesFabricJar)
    gametestRuntimeOnly "dev.architectury:architectury-fabric:${architecturyVersion}"
    gametestRuntimeOnly files(placeboFabricJar, apothicAttributesFabricJar)
}

def verifyApotheosisFabricJar = tasks.register('verifyApotheosisFabricJar') {
    inputs.file(apotheosisFabricJar)
    inputs.property('apotheosisVersion', apotheosisVersion)
    inputs.property('apotheosisModVersion', apotheosisModVersion)
    inputs.property('expectedApotheosisFabricSha256', expectedApotheosisFabricSha256)
    doLast {
        if (!apotheosisFabricJar.isFile()) {
            throw new GradleException(
                "Missing Apotheosis Fabric JAR: ${apotheosisFabricJar}. " +
                    "Build :fabric:assemble in the sibling Apotheosis repository or set apotheosis_fabric_jar."
            )
        }

        def actualSha256 = java.security.MessageDigest.getInstance('SHA-256')
            .digest(apotheosisFabricJar.bytes)
            .collect { String.format('%02X', it & 0xFF) }
            .join()
        if (!expectedApotheosisFabricSha256.isEmpty() && actualSha256 != expectedApotheosisFabricSha256) {
            throw new GradleException(
                "Apotheosis Fabric JAR SHA-256 mismatch for ${apotheosisFabricJar}: " +
                    "expected ${expectedApotheosisFabricSha256}, got ${actualSha256}."
            )
        }

        def artifactMetadata = new java.util.jar.JarFile(apotheosisFabricJar).withCloseable { jar ->
            def fabricModEntry = jar.getEntry('fabric.mod.json')
            def fabricMod = fabricModEntry == null ? null : jar.getInputStream(fabricModEntry).withCloseable { stream ->
                new groovy.json.JsonSlurper().parse(stream)
            }
            [
                fabric: fabricModEntry != null,
                neoforge: jar.getEntry('META-INF/neoforge.mods.toml') != null,
                id: fabricMod?.id,
                version: fabricMod?.version
            ]
        }
        if (!artifactMetadata.fabric || artifactMetadata.neoforge ||
            artifactMetadata.id != 'apotheosis' || artifactMetadata.version != apotheosisModVersion) {
            throw new GradleException(
                "${apotheosisFabricJar} is not the expected Fabric Apotheosis artifact " +
                    "(${apotheosisVersion}, mod version ${apotheosisModVersion})."
            )
        }
    }
}

def verifyApotheosisGameTestRuntime = tasks.register('verifyApotheosisGameTestRuntime') {
    inputs.files(placeboFabricJar, apothicAttributesFabricJar)
    doLast {
        [
            [file: placeboFabricJar, id: 'placebo', version: placeboModVersion],
            [file: apothicAttributesFabricJar, id: 'apothic_attributes', version: apothicAttributesModVersion]
        ].each { artifact ->
            if (!artifact.file.isFile()) {
                throw new GradleException(
                    "Missing ${artifact.id} Fabric JAR: ${artifact.file}. " +
                        "Build the sibling Fabric project or override its *_fabric_jar property."
                )
            }

            def metadata = new java.util.jar.JarFile(artifact.file).withCloseable { jar ->
                def entry = jar.getEntry('fabric.mod.json')
                entry == null ? null : jar.getInputStream(entry).withCloseable { stream ->
                    new groovy.json.JsonSlurper().parse(stream)
                }
            }
            if (metadata?.id != artifact.id || metadata?.version != artifact.version) {
                throw new GradleException(
                    "${artifact.file} is not the expected Fabric ${artifact.id} ${artifact.version} artifact."
                )
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn verifyApotheosisFabricJar
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

test {
    dependsOn verifyApotheosisFabricJar
    useJUnitPlatform()
}

def ownedGameTestName =
    'levelledmobs-apotheosis-gametest:apotheosis_world_tier_game_tests_nearest_world_tier_drives_lifecycle_level_and_persists'
def gameTestReportFile = layout.buildDirectory.file(
    'test-results/gameTest/TEST-levelledmobs-apotheosis-gametest.xml'
)

tasks.named('runGameTest') {
    dependsOn verifyApotheosisFabricJar, verifyApotheosisGameTestRuntime
    systemProperty 'fabric-api.gametest.filter', ownedGameTestName
    systemProperty 'fabric-api.gametest.report-file', gameTestReportFile.get().asFile.absolutePath
    doFirst {
        gameTestReportFile.get().asFile.parentFile.mkdirs()
    }
}
