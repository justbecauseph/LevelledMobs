plugins {
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

base {
	archivesName = "levelledmobs-fabric"
	version = "1.0.0"
	group = "lampas.levelledmobs"
}

repositories {
	mavenCentral()
	mavenLocal()
	maven { url = "https://maven.nucleoid.xyz" }
	maven { url = "https://jitpack.io" }
}

dependencies {
	minecraft "com.mojang:minecraft:26.2"
	implementation "net.fabricmc:fabric-loader:0.19.3"
	compileOnly("net.fabricmc.fabric-api:fabric-api:0.152.1+26.2")
	localRuntime("net.fabricmc.fabric-api:fabric-api:0.152.1+26.2")
	compileOnly("eu.pb4:placeholder-api:3.1.0-beta.1+26.2")
	localRuntime("eu.pb4:placeholder-api:3.1.0-beta.1+26.2")

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "net.fabricmc.fabric-api:fabric-api:0.152.1+26.2"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

test {
	useJUnitPlatform()
}
